<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="home.title"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <style>
      body { display: grid; place-items: start center; padding: 48px 16px; }
      main { width: min(560px, 100%); }
      h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 600; }
      p { margin: 0 0 28px; color: var(--paper-dim); }
      h2 { margin: 0 0 10px; font-size: 1.1rem; font-weight: 600; }
      h2.next { margin-top: 32px; }
      ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--feldgrau); }
      li { border-bottom: 1px solid var(--feldgrau); }
      a { display: block; padding: 12px 4px; color: var(--paper); text-decoration: none; }
      a:hover { background: var(--feldgrau-deep); }
      a span { display: block; color: var(--paper-dim); font-size: 0.9rem; }
      a span.name { color: var(--paper); font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="home.title"></h1>
      <p data-i18n="home.intro"></p>
      <h2 data-i18n="home.game"></h2>
      <ul>
        <li>
          <a href="/src/game/">
            <span data-i18n="home.map" class="name"></span>
            <span data-i18n="home.mapText"></span>
          </a>
        </li>
      </ul>
      <h2 class="next" data-i18n="home.tools"></h2>
      <ul>
        <li>
          <a href="/src/tools/map-calibration/">
            <span data-i18n="home.calibration" class="name"></span>
            <span data-i18n="home.calibrationText"></span>
          </a>
        </li>
        <li>
          <a href="/src/tools/map-painter/">
            <span data-i18n="home.painter" class="name"></span>
            <span data-i18n="home.painterText"></span>
          </a>
        </li>
        <li>
          <a href="/src/tools/units-index/">
            <span data-i18n="home.unitsIndex" class="name"></span>
            <span data-i18n="home.unitsIndexText"></span>
          </a>
        </li>
        <li>
          <a href="/src/tools/soviet-cards/">
            <span data-i18n="home.sovietCards" class="name"></span>
            <span data-i18n="home.sovietCardsText"></span>
          </a>
        </li>
      </ul>
    </main>
    <script type="module">
      import { applyI18n } from "/src/i18n/i18n.ts";
      applyI18n();
    </script>
  </body>
</html>
