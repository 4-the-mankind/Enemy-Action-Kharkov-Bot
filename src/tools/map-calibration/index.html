<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calage de la carte — EA Kharkov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside class="panel">
      <header class="panel-head">
        <a class="home" href="/">EA Kharkov Bot</a>
        <h1>Calage de la carte</h1>
        <p class="file" id="file-state">data/map-grid.json</p>
      </header>

      <section class="group" aria-labelledby="g-grid">
        <h2 id="g-grid">Grille</h2>
        <div class="counter">
          <label for="cols">Colonnes</label>
          <button type="button" data-step="cols" data-delta="-1" aria-label="Retirer une colonne">−</button>
          <input id="cols" type="number" min="1" max="99" />
          <button type="button" data-step="cols" data-delta="1" aria-label="Ajouter une colonne">+</button>
        </div>
        <div class="counter">
          <label for="rows">Lignes</label>
          <button type="button" data-step="rows" data-delta="-1" aria-label="Retirer une ligne">−</button>
          <input id="rows" type="number" min="1" max="99" />
          <button type="button" data-step="rows" data-delta="1" aria-label="Ajouter une ligne">+</button>
        </div>
        <div class="field">
          <label for="colStep">Écart entre colonnes</label>
          <input id="colStep" type="number" min="10" step="0.1" /><span class="unit">px</span>
        </div>
        <div class="field">
          <label for="rowStep">Hauteur d'une case</label>
          <input id="rowStep" type="number" min="10" step="0.1" /><span class="unit">px</span>
        </div>
        <label class="check"><input id="regular" type="checkbox" checked /> Hexagones réguliers</label>
        <div class="field wide">
          <label for="shift">Colonnes paires</label>
          <select id="shift">
            <option value="0.5">décalées vers le bas</option>
            <option value="-0.5">décalées vers le haut</option>
            <option value="inset">rentrées (une case de moins)</option>
          </select>
        </div>
      </section>

      <section class="group" aria-labelledby="g-bg">
        <h2 id="g-bg">Image de fond</h2>
        <div class="field wide">
          <label for="image">Image</label>
          <select id="image"></select>
        </div>
        <label class="upload">
          <input id="upload" type="file" accept="image/png,image/jpeg,image/webp" />
          <span>Importer une image…</span>
        </label>
        <p class="hint">Position du pixel en haut à gauche de l'image</p>
        <div class="pair">
          <div class="field">
            <label for="bgX">X</label>
            <input id="bgX" type="number" step="1" /><span class="unit">px</span>
          </div>
          <div class="field">
            <label for="bgY">Y</label>
            <input id="bgY" type="number" step="1" /><span class="unit">px</span>
          </div>
        </div>
        <div class="field">
          <label for="bgScale">Échelle</label>
          <input id="bgScale" type="number" min="1" step="0.1" /><span class="unit">%</span>
        </div>
        <p class="hint">Flèches du clavier : déplacer l'image de 1 px (Maj : 10 px).</p>
      </section>

      <section class="group" aria-labelledby="g-view">
        <h2 id="g-view">Affichage</h2>
        <label class="check"><input id="showLines" type="checkbox" checked /> Lignes noires</label>
        <label class="check"><input id="showHexes" type="checkbox" checked /> Hexagones</label>
        <label class="check"><input id="showLabels" type="checkbox" checked /> Numéros des cases</label>
        <div class="field">
          <label for="bgOpacity">Opacité de l'image</label>
          <input id="bgOpacity" type="range" min="0" max="100" value="100" />
        </div>
        <button type="button" id="fit" class="ghost">Voir toute la carte</button>
      </section>

      <footer class="actions">
        <button type="button" id="save" class="primary">Enregistrer</button>
        <div class="pair">
          <label class="upload ghost-file">
            <input id="import" type="file" accept="application/json,.json" />
            <span>Importer un JSON…</span>
          </label>
          <button type="button" id="download" class="ghost">Télécharger le JSON</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </footer>
    </aside>

    <main class="viewport" id="viewport" tabindex="0" aria-label="Carte">
      <div class="stage" id="stage">
        <div class="bg" id="bg"></div>
        <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="readout" id="readout">Survolez la carte</div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
