<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map calibration — EA Kharkov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside class="panel">
      <header class="panel-head">
        <a class="home" href="/">EA Kharkov Bot</a>
        <h1>Map calibration</h1>
        <p class="file" id="file-state">data/map-grid.json</p>
      </header>

      <section class="group" aria-labelledby="g-grid">
        <h2 id="g-grid">Grid</h2>
        <div class="counter">
          <label for="cols">Columns</label>
          <button type="button" data-step="cols" data-delta="-1" aria-label="Remove a column">−</button>
          <input id="cols" type="number" min="1" max="99" />
          <button type="button" data-step="cols" data-delta="1" aria-label="Add a column">+</button>
        </div>
        <div class="counter">
          <label for="rows">Rows</label>
          <button type="button" data-step="rows" data-delta="-1" aria-label="Remove a row">−</button>
          <input id="rows" type="number" min="1" max="99" />
          <button type="button" data-step="rows" data-delta="1" aria-label="Add a row">+</button>
        </div>
        <div class="field">
          <label for="colStep">Column spacing</label>
          <input id="colStep" type="number" min="10" step="0.1" /><span class="unit">px</span>
        </div>
        <div class="field">
          <label for="rowStep">Hex height</label>
          <input id="rowStep" type="number" min="10" step="0.1" /><span class="unit">px</span>
        </div>
        <label class="check"><input id="regular" type="checkbox" checked /> Regular hexes</label>
        <div class="field wide">
          <label for="shift">Even columns</label>
          <select id="shift">
            <option value="0.5">shifted down</option>
            <option value="-0.5">shifted up</option>
            <option value="inset">inset (one hex fewer)</option>
          </select>
        </div>
      </section>

      <section class="group" aria-labelledby="g-bg">
        <h2 id="g-bg">Background image</h2>
        <div class="field wide">
          <label for="image">Image</label>
          <select id="image"></select>
        </div>
        <label class="upload">
          <input id="upload" type="file" accept="image/png,image/jpeg,image/webp" />
          <span>Import an image…</span>
        </label>
        <p class="hint">Position of the image's top-left pixel</p>
        <div class="pair">
          <div class="field">
            <label for="bgX">X</label>
            <input id="bgX" type="number" step="1" /><span class="unit">px</span>
          </div>
          <div class="field">
            <label for="bgY">Y</label>
            <input id="bgY" type="number" step="1" /><span class="unit">px</span>
          </div>
        </div>
        <div class="field">
          <label for="bgScale">Scale</label>
          <input id="bgScale" type="number" min="1" step="0.1" /><span class="unit">%</span>
        </div>
        <p class="hint">Arrow keys: move the image by 1 px (Shift: 10 px).</p>
      </section>

      <section class="group" aria-labelledby="g-view">
        <h2 id="g-view">Display</h2>
        <label class="check"><input id="showLines" type="checkbox" checked /> Black lines</label>
        <label class="check"><input id="showHexes" type="checkbox" checked /> Hexes</label>
        <label class="check"><input id="showLabels" type="checkbox" checked /> Hex numbers</label>
        <div class="field">
          <label for="bgOpacity">Image opacity</label>
          <input id="bgOpacity" type="range" min="0" max="100" value="100" />
        </div>
        <button type="button" id="fit" class="ghost">Show whole map</button>
      </section>

      <footer class="actions">
        <button type="button" id="save" class="primary">Save</button>
        <div class="pair">
          <label class="upload ghost-file">
            <input id="import" type="file" accept="application/json,.json" />
            <span>Import JSON…</span>
          </label>
          <button type="button" id="download" class="ghost">Download JSON</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </footer>
    </aside>

    <main class="viewport" id="viewport" tabindex="0" aria-label="Map">
      <div class="stage" id="stage">
        <div class="bg" id="bg"></div>
        <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="readout" id="readout">Hover over the map</div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
