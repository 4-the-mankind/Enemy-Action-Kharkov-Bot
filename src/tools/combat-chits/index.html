<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combat chits — EA Kharkov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Dev only (task 5.10): not built, the chit scans stay out of the repository. -->
    <header class="bar">
      <a class="home" href="../../../">EA Kharkov Bot</a>
      <h1 data-i18n="chitsTool.title"></h1>
      <p class="file" data-i18n="chitsTool.file"></p>
    </header>

    <form class="test" id="test">
      <h2 data-i18n="chitsTool.test.title"></h2>
      <div class="fields">
        <label><span data-i18n="chitsTool.test.kind"></span>
          <select name="kind">
            <option value="germanAttack" data-i18n="chitsTool.test.germanAttack"></option>
            <option value="sovietAttack" data-i18n="chitsTool.test.sovietAttack"></option>
          </select></label>
        <label><span data-i18n="chitsTool.test.turn"></span><input name="turn" type="number" min="1" max="18" value="1" /></label>
        <label><span data-i18n="chitsTool.test.attack"></span><input name="attack" type="number" min="0" value="8" /></label>
        <label><span data-i18n="chitsTool.test.defense"></span><input name="defense" type="number" min="0" value="4" /></label>
        <label><span data-i18n="chitsTool.test.terrain"></span><select name="terrain" id="terrain"></select></label>
        <label><span data-i18n="chitsTool.test.drawn"></span><input name="drawn" type="number" min="0" value="3" /></label>
        <label><span data-i18n="chitsTool.test.commandValue"></span><select name="commandValue" id="command"></select></label>
      </div>
      <div class="flags" id="flags"></div>
    </form>

    <div class="toolbar">
      <p class="count" id="count"></p>
    </div>

    <main class="chits" id="chits" aria-label="Combat chits"></main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
