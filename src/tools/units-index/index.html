<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Units index — EA Kharkov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/theme.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="home" href="/">EA Kharkov Bot</a>
      <h1>Units index</h1>
      <p class="file">data/units.json — verification screen (2.3)</p>
    </header>

    <div class="toolbar">
      <div class="tabs" role="tablist" id="side-tabs">
        <button type="button" class="tab active" data-side="all" role="tab" aria-selected="true">All</button>
        <button type="button" class="tab" data-side="german" role="tab" aria-selected="false">German</button>
        <button type="button" class="tab" data-side="soviet" role="tab" aria-selected="false">Soviet</button>
      </div>
      <div class="tabs" role="tablist" id="type-tabs">
        <button type="button" class="tab active" data-type="all" role="tab" aria-selected="true">All types</button>
        <button type="button" class="tab" data-type="infantry" role="tab" aria-selected="false">Infantry</button>
        <button type="button" class="tab" data-type="mechanized" role="tab" aria-selected="false">Mechanized</button>
      </div>
      <p class="count" id="count"></p>
    </div>

    <main class="grid" id="grid" aria-label="Units"></main>

    <p class="empty" id="empty" hidden>No units in data/units.json yet.</p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
