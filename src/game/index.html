<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Situation map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside id="unitsDossier" class="dossier left" aria-label="Units">
      <div class="dossier-body units-body">
        <header class="panel-head">
          <h1>Units</h1>
        </header>
        <section id="setup" class="setup" aria-label="Set up"></section>
        <div id="groups" class="groups" data-autoscroll></div>
      </div>
      <nav class="folder-tabs" role="tablist" aria-label="Units panel">
        <button type="button" class="fold-btn" data-fold aria-label="Fold the units panel" title="Fold the units panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button type="button" class="folder-tab" role="tab" data-tab="units">Units</button>
      </nav>
    </aside>

    <main class="map-area">
      <div id="viewport" class="viewport" tabindex="0" aria-label="Game map: drag or arrow keys to pan, wheel or + and - to zoom, 0 to fit"></div>
      <aside id="inspector" class="inspector" aria-live="polite"></aside>
      <section id="startNotice" class="start-notice" aria-live="polite" aria-label="Before the game starts"></section>
      <button type="button" id="unitsToggle" class="map-toggle" aria-pressed="true" aria-keyshortcuts="u"
        title="Hide the counters to read the map under them (U)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect class="c-back" x="7" y="3" width="10" height="10" rx="1" /><rect class="c-front" x="3" y="7" width="10" height="10" rx="1" /><path class="slash" d="M2 18 18 2" /></svg>
        <span data-label>Hide units</span> <kbd>U</kbd>
      </button>
    </main>

    <aside id="railDossier" class="dossier right" aria-label="Bot, log and overlays">
      <nav class="folder-tabs" role="tablist" aria-label="Rail">
        <button type="button" class="fold-btn" data-fold aria-label="Fold the rail" title="Fold the rail">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" /></svg>
        </button>
        <button type="button" class="folder-tab" role="tab" data-tab="bot">Bot</button>
        <button type="button" class="folder-tab" role="tab" data-tab="log">Log</button>
        <button type="button" class="folder-tab" role="tab" data-tab="overlays">Overlays</button>
      </nav>
      <div class="dossier-body rail">
        <header class="panel-head">
          <h1>Situation map</h1>
          <a class="home" href="/">Home</a>
        </header>

        <section data-tabpanel="bot" class="rail-section bot-section" aria-label="Bot">
          <div id="deck" class="deck-area"></div>
          <div id="activate" class="activate"></div>
          <section id="orders" class="orders-area" aria-label="Activation" aria-live="polite" hidden></section>
          <section id="why" class="why" aria-label="Why this move" hidden></section>
          <dl id="bot" class="bot-status"></dl>
        </section>

        <section data-tabpanel="log" class="rail-section log-section" aria-label="Log">
          <div class="log-tools">
            <button type="button" id="undo" class="switch" aria-keyshortcuts="Control+Z" disabled>Undo <kbd>Ctrl</kbd> + <kbd>Z</kbd></button>
          </div>
          <p class="hint">Undo takes back the last action and removes it from the log. Arrow keys move the map.</p>
          <ol id="log" class="log"></ol>
        </section>

        <section data-tabpanel="overlays" class="rail-section" aria-label="Overlays">
          <p class="hint">Lay a sheet on the map to check what the bot reads from it.</p>
          <ul id="layers" class="sheets"></ul>
          <div class="view-controls">
            <button type="button" id="toggleImage" class="switch" aria-pressed="true" aria-keyshortcuts="m">
              Printed map <kbd>M</kbd>
            </button>
            <button type="button" id="unitsSwitch" class="switch" aria-pressed="true" aria-keyshortcuts="u">
              Units <kbd>U</kbd>
            </button>
            <button type="button" id="fit" class="switch" aria-keyshortcuts="0">Fit map <kbd>0</kbd></button>
          </div>
        </section>

        <p id="status" class="status" role="status"></p>
      </div>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
