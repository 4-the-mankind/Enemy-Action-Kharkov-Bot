<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.title"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside id="unitsDossier" class="dossier left" data-i18n-aria-label="page.units">
      <div class="dossier-body units-body">
        <header class="panel-head">
          <h1 data-i18n="page.units"></h1>
        </header>
        <section id="setup" class="setup" data-i18n-aria-label="page.setUp"></section>
        <div id="groups" class="groups" data-autoscroll></div>
      </div>
      <nav class="folder-tabs" role="tablist" data-i18n-aria-label="page.unitsPanel">
        <button type="button" class="fold-btn" data-fold data-i18n-aria-label="page.foldUnits" data-i18n-title="page.foldUnits">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button type="button" class="folder-tab" role="tab" data-tab="units" data-i18n="page.units"></button>
      </nav>
    </aside>

    <main class="map-area">
      <div id="viewport" class="viewport" tabindex="0" data-i18n-aria-label="page.viewport"></div>
      <aside id="inspector" class="inspector" aria-live="polite"></aside>
      <section id="startNotice" class="start-notice" aria-live="polite" data-i18n-aria-label="page.beforeStart"></section>
      <section id="reminders" class="reminders" aria-live="polite" data-i18n-aria-label="page.reminders" hidden></section>
      <section id="germanBar" class="german-bar" aria-live="polite" data-i18n-aria-label="germanBar.label" hidden></section>
      <div class="map-tools">
        <button type="button" id="unitsToggle" class="map-toggle" aria-pressed="true" aria-keyshortcuts="u"
          data-i18n-title="page.hideUnitsTitle">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect class="c-back" x="7" y="3" width="10" height="10" rx="1" /><rect class="c-front" x="3" y="7" width="10" height="10" rx="1" /><path class="slash" d="M2 18 18 2" /></svg>
          <span data-label data-i18n="map.hideUnits"></span> <kbd>U</kbd>
        </button>
        <button type="button" class="map-toggle supply-toggle soviet" data-supply="soviet" aria-pressed="false" aria-keyshortcuts="s"
          data-i18n-title="page.sovietSupplyTitle">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path class="s-path" d="M3 16 9 10l4 1" /><circle class="s-head" cx="15" cy="6" r="3.2" /></svg>
          <span data-i18n="page.sovietSupply"></span> <kbd>S</kbd>
        </button>
        <button type="button" class="map-toggle supply-toggle german" data-supply="german" aria-pressed="false" aria-keyshortcuts="g"
          data-i18n-title="page.germanSupplyTitle">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path class="s-path" d="M3 16 9 10l4 1" /><circle class="s-head" cx="15" cy="6" r="3.2" /></svg>
          <span data-i18n="page.germanSupply"></span> <kbd>G</kbd>
        </button>
      </div>
    </main>

    <aside id="railDossier" class="dossier right" data-i18n-aria-label="page.rail">
      <nav class="folder-tabs" role="tablist" data-i18n-aria-label="page.railTabs">
        <button type="button" class="fold-btn" data-fold data-i18n-aria-label="page.foldRail" data-i18n-title="page.foldRail">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" /></svg>
        </button>
        <button type="button" class="folder-tab" role="tab" data-tab="bot" data-i18n="page.tab.bot"></button>
        <button type="button" class="folder-tab" role="tab" data-tab="log" data-i18n="page.tab.log"></button>
        <button type="button" class="folder-tab" role="tab" data-tab="overlays" data-i18n="page.tab.overlays"></button>
        <button type="button" class="folder-tab combat-tab" role="tab" data-tab="combat" data-i18n="page.tab.combat" disabled></button>
      </nav>
      <div class="dossier-body rail">
        <header class="panel-head">
          <h1 data-i18n="page.title"></h1>
          <a class="home" href="/" data-i18n="page.home"></a>
        </header>

        <section data-tabpanel="bot" class="rail-section bot-section" data-i18n-aria-label="page.tab.bot">
          <div id="deck" class="deck-area"></div>
          <div id="activate" class="activate"></div>
          <section id="reading" class="reading" data-i18n-aria-label="page.sovietCardsRead" hidden></section>
          <section id="orders" class="orders-area" data-i18n-aria-label="page.activation" aria-live="polite" hidden></section>
          <section id="why" class="why" data-i18n-aria-label="page.whyThisMove" hidden></section>
          <dl id="bot" class="bot-status"></dl>
        </section>

        <section data-tabpanel="log" class="rail-section log-section" data-i18n-aria-label="page.tab.log">
          <div class="log-tools">
            <button type="button" id="undo" class="switch" aria-keyshortcuts="Control+Z" disabled><span data-i18n="page.undo"></span> <kbd>Ctrl</kbd> + <kbd>Z</kbd></button>
          </div>
          <p class="hint" data-i18n="page.undoHint"></p>
          <ol id="log" class="log"></ol>
        </section>

        <section data-tabpanel="combat" class="rail-section combat-section" data-i18n-aria-label="page.tab.combat">
          <div id="combat" aria-live="polite"></div>
        </section>

        <section data-tabpanel="overlays" class="rail-section" data-i18n-aria-label="page.tab.overlays">
          <p class="hint" data-i18n="page.overlaysHint"></p>
          <ul id="layers" class="sheets"></ul>
          <section class="legend" aria-labelledby="legendTitle">
            <h2 id="legendTitle" data-i18n="legend.title"></h2>
            <dl>
              <div><dt><svg viewBox="0 0 40 24" aria-hidden="true"><polyline class="lg-trail" points="4,18 18,8 36,12" /><circle class="lg-origin" cx="4" cy="18" r="3.5" /></svg></dt>
                <dd data-i18n="legend.trail"></dd></div>
              <div><dt><svg viewBox="0 0 40 24" aria-hidden="true"><polygon class="lg-chosen" points="10,2 30,2 38,12 30,22 10,22 2,12" /></svg></dt>
                <dd data-i18n="legend.chosen"></dd></div>
              <div><dt><svg viewBox="0 0 40 24" aria-hidden="true"><polygon class="lg-dropped" points="10,2 30,2 38,12 30,22 10,22 2,12" /></svg></dt>
                <dd data-i18n="legend.dropped"></dd></div>
            </dl>
          </section>
          <div class="view-controls">
            <button type="button" id="toggleImage" class="switch" aria-pressed="true" aria-keyshortcuts="m">
              <span data-i18n="page.printedMap"></span> <kbd>M</kbd>
            </button>
            <button type="button" id="unitsSwitch" class="switch" aria-pressed="true" aria-keyshortcuts="u">
              <span data-i18n="page.unitsSwitch"></span> <kbd>U</kbd>
            </button>
            <button type="button" id="fit" class="switch" aria-keyshortcuts="0"><span data-i18n="page.fitMap"></span> <kbd>0</kbd></button>
          </div>
        </section>

        <p id="status" class="status" role="status"></p>
      </div>
    </aside>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
